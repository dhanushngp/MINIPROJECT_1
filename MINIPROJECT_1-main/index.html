<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ai Descriptive Answer Evaluator — Academic AI Dossier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'monospace'],
            display: ['"Space Grotesk"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Universal Sharp Corners Override */
    *, *::before, *::after {
      border-radius: 0 !important;
    }

    /* Subtle architectural engineering grid pattern */
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
    }
    .dark .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }

    /* Registration Crosshair Corners for Editorial Blocks */
    .crosshair-corner {
      position: relative;
    }
    .crosshair-corner::before {
      content: '+';
      position: absolute;
      top: -6px;
      left: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1;
      opacity: 0.45;
      pointer-events: none;
    }
    .crosshair-corner::after {
      content: '+';
      position: absolute;
      bottom: -6px;
      right: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1;
      opacity: 0.45;
      pointer-events: none;
    }

    /* Clean hairline border utility */
    .hairline-border {
      border: 1px solid rgba(0, 0, 0, 0.12);
    }
    .dark .hairline-border {
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .view-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes shimmer-bg {
      0% {
        background-position: -1000px 0;
      }
      100% {
        background-position: 1000px 0;
      }
    }

    .animate-shimmer {
      background: linear-gradient(to right, transparent 0%, #737373 50%, transparent 100%);
      background-size: 1000px 100%;
      animation: shimmer-bg 2s linear infinite;
    }

    @keyframes pulse-bar {
      0%, 100% {
        transform: scaleY(0.35);
        opacity: 0.5;
      }
      50% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .animate-pulse-bar {
      animation: pulse-bar 1.2s infinite ease-in-out;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="transition-colors duration-200 antialiased min-h-screen bg-white text-black dark:bg-[#070707] dark:text-[#f2f2f2] bg-grid-pattern selection:bg-black selection:text-white dark:selection:bg-white dark:selection:text-black">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
